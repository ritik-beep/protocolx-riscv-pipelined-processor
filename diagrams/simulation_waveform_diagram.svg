<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .mono { font-family: 'Courier New', monospace; font-size: 10px; fill: #0f172a; }
      .wave-clk { stroke: #2563eb; stroke-width: 1.5; fill: none; }
      .wave-bus { stroke: #059669; stroke-width: 1.5; fill: #ecfdf5; }
      .wave-stall { stroke: #dc2626; stroke-width: 1.5; fill: #fef2f2; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <rect width="900" height="360" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Header -->
  <text x="20" y="24" class="hdr">ProtocolX — Pipeline Cycle &amp; Waveform Timing Diagram</text>
  <text x="650" y="24" class="lbl" fill="#64748b">Verified in Icarus Verilog</text>

  <!-- Cycle Headers -->
  <text x="130" y="45" class="lbl" text-anchor="middle">C0</text>
  <text x="200" y="45" class="lbl" text-anchor="middle">C1</text>
  <text x="270" y="45" class="lbl" text-anchor="middle">C2</text>
  <text x="340" y="45" class="lbl" text-anchor="middle">C3</text>
  <text x="410" y="45" class="lbl" text-anchor="middle">C4 (Stall)</text>
  <text x="480" y="45" class="lbl" text-anchor="middle">C5</text>
  <text x="550" y="45" class="lbl" text-anchor="middle">C6</text>
  <text x="620" y="45" class="lbl" text-anchor="middle">C7</text>
  <text x="690" y="45" class="lbl" text-anchor="middle">C8</text>
  <text x="760" y="45" class="lbl" text-anchor="middle">C9</text>
  <text x="830" y="45" class="lbl" text-anchor="middle">C10</text>

  <!-- Grid Vertical Lines -->
  <line x1="95" y1="35" x2="95" y2="340" stroke="#94a3b8" stroke-width="1"/>
  <line x1="165" y1="50" x2="165" y2="340" class="grid-line"/>
  <line x1="235" y1="50" x2="235" y2="340" class="grid-line"/>
  <line x1="305" y1="50" x2="305" y2="340" class="grid-line"/>
  <line x1="375" y1="50" x2="375" y2="340" class="grid-line"/>
  <line x1="445" y1="50" x2="445" y2="340" class="grid-line"/>
  <line x1="515" y1="50" x2="515" y2="340" class="grid-line"/>
  <line x1="585" y1="50" x2="585" y2="340" class="grid-line"/>
  <line x1="655" y1="50" x2="655" y2="340" class="grid-line"/>
  <line x1="725" y1="50" x2="725" y2="340" class="grid-line"/>
  <line x1="795" y1="50" x2="795" y2="340" class="grid-line"/>
  <line x1="865" y1="50" x2="865" y2="340" class="grid-line"/>

  <!-- Row 1: Clock -->
  <text x="15" y="75" class="lbl">CLK (100MHz)</text>
  <path d="M 95 80 L 130 80 L 130 65 L 165 65 L 165 80 L 200 80 L 200 65 L 235 65 L 235 80 L 270 80 L 270 65 L 305 65 L 305 80 L 340 80 L 340 65 L 375 65 L 375 80 L 410 80 L 410 65 L 445 65 L 445 80 L 480 80 L 480 65 L 515 65 L 515 80 L 550 80 L 550 65 L 585 65 L 585 80 L 620 80 L 620 65 L 655 65 L 655 80 L 690 80 L 690 65 L 725 65 L 725 80 L 760 80 L 760 65 L 795 65 L 795 80 L 830 80 L 830 65 L 865 65" class="wave-clk"/>

  <!-- Row 2: Program Counter (PC) -->
  <text x="15" y="115" class="lbl">PC [31:0]</text>
  <polygon points="98,110 105,100 155,100 162,110 155,120 105,120" class="wave-bus"/>
  <text x="130" y="114" class="mono" text-anchor="middle">0x00</text>
  <polygon points="168,110 175,100 225,100 232,110 225,120 175,120" class="wave-bus"/>
  <text x="200" y="114" class="mono" text-anchor="middle">0x04</text>
  <polygon points="238,110 245,100 295,100 302,110 295,120 245,120" class="wave-bus"/>
  <text x="270" y="114" class="mono" text-anchor="middle">0x08</text>
  <polygon points="308,110 315,100 365,100 372,110 365,120 315,120" class="wave-bus"/>
  <text x="340" y="114" class="mono" text-anchor="middle">0x0C</text>
  <!-- Stall on PC at 0x10 held for 2 cycles -->
  <polygon points="378,110 385,100 435,100 442,110 435,120 385,120" class="wave-stall"/>
  <text x="410" y="114" class="mono" fill="#b91c1c" text-anchor="middle">0x10 (STALL)</text>
  <polygon points="448,110 455,100 505,100 512,110 505,120 455,120" class="wave-bus"/>
  <text x="480" y="114" class="mono" text-anchor="middle">0x10</text>
  <polygon points="518,110 525,100 575,100 582,110 575,120 525,120" class="wave-bus"/>
  <text x="550" y="114" class="mono" text-anchor="middle">0x14</text>
  <polygon points="588,110 595,100 645,100 652,110 645,120 595,120" class="wave-bus"/>
  <text x="620" y="114" class="mono" text-anchor="middle">0x18</text>

  <!-- Row 3: IF/ID Instruction -->
  <text x="15" y="155" class="lbl">IF/ID (Instr)</text>
  <polygon points="168,150 175,140 225,140 232,150 225,160 175,160" class="wave-bus"/>
  <text x="200" y="154" class="mono" text-anchor="middle">ADDI x1</text>
  <polygon points="238,150 245,140 295,140 302,150 295,160 245,160" class="wave-bus"/>
  <text x="270" y="154" class="mono" text-anchor="middle">ADDI x2</text>
  <polygon points="308,150 315,140 365,140 372,150 365,160 315,160" class="wave-bus"/>
  <text x="340" y="154" class="mono" text-anchor="middle">SW x1</text>
  <polygon points="378,150 385,140 435,140 442,150 435,160 385,160" class="wave-stall"/>
  <text x="410" y="154" class="mono" fill="#b91c1c" text-anchor="middle">LW x2 (Hold)</text>
  <polygon points="448,150 455,140 505,140 512,150 505,160 455,160" class="wave-bus"/>
  <text x="480" y="154" class="mono" text-anchor="middle">ADDI x3</text>

  <!-- Row 4: ID/EX Stage -->
  <text x="15" y="195" class="lbl">ID/EX (Execute)</text>
  <polygon points="238,190 245,180 295,180 302,190 295,200 245,200" class="wave-bus"/>
  <text x="270" y="194" class="mono" text-anchor="middle">x1 = 10</text>
  <polygon points="308,190 315,180 365,180 372,190 365,200 315,200" class="wave-bus"/>
  <text x="340" y="194" class="mono" text-anchor="middle">x2 = 20</text>
  <polygon points="378,190 385,180 435,180 442,190 435,200 385,200" class="wave-stall"/>
  <text x="410" y="194" class="mono" fill="#b91c1c" text-anchor="middle">NOP (Bubble)</text>
  <polygon points="448,190 455,180 505,180 512,190 505,200 455,200" class="wave-bus"/>
  <text x="480" y="194" class="mono" text-anchor="middle">Addr=0(x0)</text>

  <!-- Row 5: Forwarding Controls -->
  <text x="15" y="235" class="lbl">ForwardA / B</text>
  <polygon points="308,230 315,220 365,220 372,230 365,240 315,240" class="wave-bus"/>
  <text x="340" y="234" class="mono" text-anchor="middle">2'b00 (None)</text>
  <polygon points="378,230 385,220 435,220 442,230 435,240 385,240" class="wave-bus"/>
  <text x="410" y="234" class="mono" text-anchor="middle">2'b10 (MEM)</text>
  <polygon points="448,230 455,220 505,220 512,230 505,240 455,240" class="wave-bus"/>
  <text x="480" y="234" class="mono" text-anchor="middle">2'b01 (WB)</text>

  <!-- Row 6: Memory Data -->
  <text x="15" y="275" class="lbl">DMEM Data</text>
  <polygon points="378,270 385,260 435,260 442,270 435,280 385,280" class="wave-bus"/>
  <text x="410" y="274" class="mono" text-anchor="middle">Wr: 0x64</text>
  <polygon points="448,270 455,260 505,260 512,270 505,280 455,280" class="wave-bus"/>
  <text x="480" y="274" class="mono" text-anchor="middle">Rd: 0x64</text>

  <!-- Row 7: Writeback (WB) -->
  <text x="15" y="315" class="lbl">WB Port (RegWr)</text>
  <polygon points="378,310 385,300 435,300 442,310 435,320 385,320" class="wave-bus"/>
  <text x="410" y="314" class="mono" text-anchor="middle">x1 &lt;= 10</text>
  <polygon points="448,310 455,300 505,300 512,310 505,320 455,320" class="wave-bus"/>
  <text x="480" y="314" class="mono" text-anchor="middle">x2 &lt;= 20</text>
  <polygon points="518,310 525,300 575,300 582,310 575,320 525,320" class="wave-bus"/>
  <text x="550" y="314" class="mono" text-anchor="middle">x3 &lt;= 30</text>
  <polygon points="588,310 595,300 645,300 652,310 645,320 595,320" class="wave-bus"/>
  <text x="620" y="314" class="mono" text-anchor="middle">x4 &lt;= 10</text>
</svg>
